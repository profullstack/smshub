appId: com.smshub.desktop
productName: SMSHub
copyright: Copyright © 2025 SMSHub

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  # Include Next.js build output for production
  - from: ../out
    to: renderer
    filter:
      - "**/*"

extraMetadata:
  main: dist/main.js

# ─── Protocol handler (deep links) ────────────────────────────
protocols:
  - name: SMSHub
    schemes:
      - smshub

# ─── macOS ─────────────────────────────────────────────────────
mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  # Code signing — set these env vars in CI:
  #   CSC_LINK — path to .p12 certificate or base64-encoded
  #   CSC_KEY_PASSWORD — certificate password
  #   APPLE_ID — Apple ID for notarization
  #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password
  #   APPLE_TEAM_ID — Apple Developer Team ID
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false  # Set to true when Apple credentials are configured

# ─── Windows ──────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # Code signing — set these env vars in CI:
  #   CSC_LINK — path to .pfx certificate or base64-encoded
  #   CSC_KEY_PASSWORD — certificate password
  # Or use certificateFile/certificatePassword in nsis section below.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Windows code signing (alternative to env vars):
  # certificateFile: path/to/certificate.pfx
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}

# ─── Linux ────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Network
  icon: resources/icons
  mimeTypes:
    - x-scheme-handler/smshub

# ─── Auto-update — GitHub Releases ────────────────────────────
publish:
  provider: github
  owner: smshub
  repo: smshub
  releaseType: release

# ─── After sign (for notarization on macOS) ───────────────────
# afterSign: scripts/notarize.js
