appId: com.smshub.desktop
productName: SMSHub
copyright: Copyright © 2026 Profullstack, Inc.

directories:
  output: release
  buildResources: resources
  app: .

files:
  - dist/**/*
  - package.json
  - "!*.ts"
  - "!tsconfig.json"
  - "!electron-builder.yml"

extraMetadata:
  main: dist/main.js

# ─── Protocol handler (deep links) ────────────────────────────
protocols:
  - name: SMSHub
    schemes:
      - smshub

# ─── macOS ─────────────────────────────────────────────────────
mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false

# ─── Windows ──────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# ─── Linux ────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Network
  mimeTypes:
    - x-scheme-handler/smshub
  desktop:
    StartupWMClass: smshub

appImage:
  artifactName: "SMSHub-${version}.AppImage"

# ─── Auto-update — GitHub Releases ────────────────────────────
publish:
  provider: github
  owner: profullstack
  repo: smshub
  releaseType: release
