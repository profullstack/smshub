<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email — SMSHub</title>
</head>
<body style="margin:0;padding:0;background-color:#030712;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#030712;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color:#111827;border-radius:12px;border:1px solid #1f2937;">
          <tr>
            <td style="padding:32px 32px 24px;text-align:center;">
              <span style="font-size:32px;">📱</span>
              <h1 style="color:#f9fafb;font-size:24px;margin:12px 0 0;">SMSHub</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 24px;">
              <h2 style="color:#f9fafb;font-size:20px;margin:0 0 12px;">Confirm your email</h2>
              <p style="color:#9ca3af;font-size:15px;line-height:1.6;margin:0 0 24px;">
                Thanks for signing up for SMSHub! Click the button below to confirm your email address and get started.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:16px;font-weight:600;padding:12px 32px;border-radius:8px;text-decoration:none;">
                      Confirm Email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="color:#6b7280;font-size:13px;line-height:1.5;margin:24px 0 0;">
                If you didn't create an account, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #1f2937;text-align:center;">
              <p style="color:#4b5563;font-size:12px;margin:0;">
                <a href="https://smshub.dev" style="color:#60a5fa;text-decoration:none;">smshub.dev</a>
                &nbsp;·&nbsp;
                <a href="https://smshub.dev/privacy" style="color:#4b5563;text-decoration:none;">Privacy</a>
                &nbsp;·&nbsp;
                <a href="https://smshub.dev/terms" style="color:#4b5563;text-decoration:none;">Terms</a>
              </p>
              <p style="color:#374151;font-size:11px;margin:8px 0 0;">© 2026 Profullstack, Inc.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
