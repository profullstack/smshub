name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # 1. Run CI checks first
  ci:
    name: CI Check
    uses: ./.github/workflows/ci.yml

  # 2. Create GitHub Release + tag
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      tag: v${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Bump version in package.json
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "release: v${{ inputs.version }}"
          git push

      - name: Create Git tag
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SMSHub v${{ inputs.version }}
          body: |
            ## SMSHub v${{ inputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Downloads
            Desktop builds (AppImage, dmg, exe) will be attached once the Electron build completes.

            ### Mobile
            iOS and Android builds are available via Expo EAS.
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

  # 3. Deploy web to Railway
  deploy-web:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

  # 4. Build Electron apps (uploads to the release)
  build-electron:
    name: Build Desktop Apps
    needs: create-release
    uses: ./.github/workflows/electron.yml
    secrets: inherit

  # 5. Build mobile apps via EAS
  build-mobile:
    name: Build Mobile Apps
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive
        continue-on-error: true

      - name: Build Android
        run: eas build --platform android --profile production --non-interactive
        continue-on-error: true

  # 6. OTA update for existing mobile installs
  ota-update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    needs: create-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA Update
        run: eas update --branch production --message "v${{ inputs.version }}" --non-interactive
        continue-on-error: true
