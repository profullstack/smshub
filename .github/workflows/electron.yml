name: Electron Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-web:
    name: Build Next.js for Electron
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Build Electron (Linux)
        working-directory: electron
        run: pnpm package:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: smshub-linux
          path: electron/dist/*.AppImage

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.AppImage

  build-macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    needs: build-web
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Build Electron (macOS)
        working-directory: electron
        run: pnpm package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: smshub-macos
          path: electron/dist/*.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.dmg

  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    needs: build-web
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Install Electron dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Build Electron (Windows)
        working-directory: electron
        run: pnpm package:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smshub-windows
          path: electron/dist/*.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
