name: Electron Builds

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install & Build
        working-directory: electron
        run: pnpm install --ignore-workspace && pnpm ci:package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: smshub-linux
          path: electron/release/*.AppImage

  build-macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install & Build
        working-directory: electron
        run: |
          pnpm install --ignore-workspace
          if [ -n "$CSC_LINK" ]; then
            pnpm ci:package:mac
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm ci:package:mac --config.mac.identity=null
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: smshub-macos
          path: electron/release/*.dmg

  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install & Build
        working-directory: electron
        run: pnpm install --ignore-workspace && pnpm ci:package:win
      - uses: actions/upload-artifact@v4
        with:
          name: smshub-windows
          path: electron/release/*.exe

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SMSHub v${{ steps.version.outputs.version }}
          body: |
            ## SMSHub Desktop v${{ steps.version.outputs.version }}

            ### Downloads
            - **Linux:** SMSHub AppImage
            - **macOS:** SMSHub dmg
            - **Windows:** SMSHub exe installer

            ### What's New
            See [CHANGELOG](https://github.com/profullstack/smshub/commits/master) for details.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/smshub-linux/*
            artifacts/smshub-macos/*
            artifacts/smshub-windows/*
          make_latest: true
