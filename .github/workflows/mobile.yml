name: Mobile Builds (EAS)

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      submit:
        description: 'Auto-submit to stores (production only)'
        required: false
        default: false
        type: boolean
  workflow_call:

jobs:
  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'ios' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Check EXPO_TOKEN
        id: check-token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠ EXPO_TOKEN not set — skipping iOS build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup EAS
        if: steps.check-token.outputs.skip != 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        if: steps.check-token.outputs.skip != 'true'
        run: |
          PROFILE="${{ inputs.profile || 'preview' }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PROFILE="production"
          fi
          eas build --platform ios --profile $PROFILE --non-interactive

      - name: Submit to App Store
        if: steps.check-token.outputs.skip != 'true' && inputs.profile == 'production' && inputs.submit
        run: eas submit --platform ios --latest --non-interactive

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'android' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Check EXPO_TOKEN
        id: check-token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠ EXPO_TOKEN not set — skipping Android build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup EAS
        if: steps.check-token.outputs.skip != 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        if: steps.check-token.outputs.skip != 'true'
        run: |
          PROFILE="${{ inputs.profile || 'preview' }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PROFILE="production"
          fi
          eas build --platform android --profile $PROFILE --non-interactive

      - name: Submit to Google Play
        if: steps.check-token.outputs.skip != 'true' && inputs.profile == 'production' && inputs.submit
        run: eas submit --platform android --latest --non-interactive
